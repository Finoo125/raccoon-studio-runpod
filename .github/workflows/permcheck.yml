name: Package permission check

# Throwaway diagnostic. Asks GHCR what this repo's GITHUB_TOKEN is allowed to do
# with the package, WITHOUT pushing anything: the registry hands back a JWT whose
# access claim lists the granted actions. Beats discovering "permission_denied:
# write_package" at the end of an 11-minute build.
on: workflow_dispatch

permissions:
  contents: read
  packages: write

jobs:
  check:
    if: github.repository == 'Finoo125/raccoon-studio-runpod'
    runs-on: ubuntu-latest
    steps:
      - name: Ask GHCR for a push-scoped token
        run: |
          set -euo pipefail
          TOK=$(curl -sS -u "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:finoo125/raccoon-studio-runpod:pull,push" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
          if [ -z "$TOK" ]; then echo "no token issued at all"; exit 1; fi
          python3 - "$TOK" <<'PY'
          import sys, json, base64
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          claims = json.loads(base64.urlsafe_b64decode(p))
          access = claims.get('access', [])
          print('access claim:', json.dumps(access))
          actions = [a for e in access for a in e.get('actions', [])]
          print('granted:', actions or '(none)')
          print('CAN PUSH:', 'push' in actions)
          sys.exit(0 if 'push' in actions else 1)
          PY
